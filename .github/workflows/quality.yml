name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend quality and evaluation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.25"
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.13
      - name: Install dependencies
        run: uv sync --locked
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run mypy
      - name: Test
        run: uv run pytest --cov=app --cov-report=term-missing
      - name: Run responsible AI evaluation
        run: uv run python -m evals.run
      - name: Validate migration SQL
        run: uv run alembic upgrade head --sql

  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22.21.0"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  deployment:
    name: Validate deployment
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Validate Compose configuration
        env:
          POSTGRES_PASSWORD: compose-validation-password
        run: docker compose config --quiet
      - name: Build deployment images
        env:
          POSTGRES_PASSWORD: compose-validation-password
        run: docker compose build
  infrastructure:
    name: Validate Azure Terraform
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.7"
      - name: Check Terraform formatting
        run: terraform -chdir=infra fmt -check -recursive
      - name: Initialize without backend
        run: terraform -chdir=infra init -backend=false -input=false
      - name: Validate Terraform
        run: terraform -chdir=infra validate
