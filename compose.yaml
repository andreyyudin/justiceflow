include:
  - path: ./local/langfuse.compose.yaml

name: justiceflow

services:
  identity:
    image: quay.io/keycloak/keycloak:26.8.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-local-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in .env}
    volumes:
      - ./local/keycloak/justiceflow-realm.json:/opt/keycloak/data/import/justiceflow-realm.json:ro
    healthcheck:
      test:
        - CMD-SHELL
        - "exec 3<>/dev/tcp/127.0.0.1/8080; printf 'GET /realms/justiceflow/.well-known/openid-configuration HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; grep -q '200 OK' <&3"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    ports:
      - "${IDENTITY_PORT:-8080}:8080"
    restart: unless-stopped

  database:
    image: postgres:18.0-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-justiceflow}
      POSTGRES_USER: ${POSTGRES_USER:-justiceflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    volumes:
      - postgres_data:/var/lib/postgresql
    restart: unless-stopped

  migrate:
    build:
      context: ./backend
    command: ["alembic", "upgrade", "head"]
    environment:
      JUSTICEFLOW_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-justiceflow}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB:-justiceflow}
    depends_on:
      database:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ./backend
    environment:
      JUSTICEFLOW_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-justiceflow}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB:-justiceflow}
      JUSTICEFLOW_MODEL_PROVIDER: ${MODEL_PROVIDER:-ollama}
      JUSTICEFLOW_MODEL_BASE_URL: ${MODEL_BASE_URL:-http://host.docker.internal:11434}
      JUSTICEFLOW_MODEL_NAME: ${MODEL_NAME:-qwen3:4b}
      JUSTICEFLOW_MODEL_API_KEY: ${MODEL_API_KEY:-}
      JUSTICEFLOW_MODEL_TIMEOUT_SECONDS: ${MODEL_TIMEOUT_SECONDS:-120}
      JUSTICEFLOW_ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      JUSTICEFLOW_LOG_LEVEL: ${LOG_LEVEL:-INFO}
      JUSTICEFLOW_LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:?Set LANGFUSE_PUBLIC_KEY in .env}
      JUSTICEFLOW_LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:?Set LANGFUSE_SECRET_KEY in .env}
      JUSTICEFLOW_LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-http://langfuse-web:3000}
      JUSTICEFLOW_LANGFUSE_ENVIRONMENT: ${LANGFUSE_ENVIRONMENT:-local}
      JUSTICEFLOW_RELEASE: ${JUSTICEFLOW_RELEASE:-development}
      JUSTICEFLOW_OIDC_ISSUER: ${OIDC_ISSUER:-http://localhost:8080/realms/justiceflow}
      JUSTICEFLOW_OIDC_AUDIENCE: ${OIDC_AUDIENCE:-justiceflow-api}
      JUSTICEFLOW_OIDC_JWKS_URL: ${OIDC_JWKS_URL:-http://identity:8080/realms/justiceflow/protocol/openid-connect/certs}
      JUSTICEFLOW_OIDC_ROLE_CLAIM: ${OIDC_ROLE_CLAIM:-realm_access.roles}
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      identity:
        condition: service_healthy
      database:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      langfuse-web:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    ports:
      - "${API_PORT:-8000}:8000"
    restart: unless-stopped

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_OIDC_AUTHORITY: ${PUBLIC_OIDC_AUTHORITY:-http://localhost:8080/realms/justiceflow}
        NEXT_PUBLIC_OIDC_CLIENT_ID: ${PUBLIC_OIDC_CLIENT_ID:-justiceflow-web}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://localhost:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    ports:
      - "${WEB_PORT:-3000}:3000"
    restart: unless-stopped

volumes:
  postgres_data:
